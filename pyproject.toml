[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling",
]

[project]
name = "pyglotaran-alias"
version = "0.1.0"
description = "Convenience module, which allows to use pyglotaran as alias in the CLI and imports"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Sebastian Weigand", email = "s.weigand.phy@gmail.com" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
urls.Core-Project = "https://github.com/glotaran/pyglotaran"
urls.Source = "https://github.com/glotaran/pyglotaran-alias"
urls.Tracker = "https://github.com/glotaran/pyglotaran-alias/issues"
scripts.pyglotaran = "pyglotaran.cli.main:main"

[dependency-groups]
dev = [ { include-group = "test" } ]
test = [
  "pyglotaran>=0.7.5",
  "pytest>=8",
]

[tool.hatch]
build.targets.wheel.packages = [ "pyglotaran" ]

[tool.ruff]
target-version = "py310"
line-length = 99
lint.select = [ "B", "E", "F", "I", "PT", "UP", "W" ]
lint.isort.force-single-line = true
