version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "18:00"
      timezone: Europe/Amsterdam
    rebase-strategy: "disabled"
    assignees:
      - jsnel
      - s-weigand
    groups:
      Python:
        update-types:
          - minor
          - patch
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "18:00"
      timezone: Europe/Amsterdam
    assignees:
      - jsnel
      - s-weigand
    groups:
      GH-Actions:
        update-types:
          - minor
          - patch
    rebase-strategy: "disabled"
